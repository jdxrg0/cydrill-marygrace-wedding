<!doctype html>
<html lang="en" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <title>You're Invited! | Cydrill and Mary Grace Wedding</title>
    <meta name="description" content="Join us as we celebrate our love and union. Save the Date & Wedding Invitation." />
    <!-- Google Fonts: Cormorant Garamond, Alex Brush, Parisienne, Plus Jakarta Sans -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Alex+Brush&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,600&family=Parisienne&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <script>
      // Prevent pinch-to-zoom and double-tap zoom on iOS Safari & mobile browsers
      document.addEventListener('gesturestart', function (e) {
        e.preventDefault();
      }, { passive: false });
      document.addEventListener('gesturechange', function (e) {
        e.preventDefault();
      }, { passive: false });
      document.addEventListener('gestureend', function (e) {
        e.preventDefault();
      }, { passive: false });
      document.addEventListener('touchmove', function (e) {
        if (e.touches && e.touches.length > 1) {
          e.preventDefault();
        }
      }, { passive: false });
    </script>
  </head>
  <body class="bg-alabaster text-espresso antialiased selection:bg-blush/40 selection:text-rust">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
